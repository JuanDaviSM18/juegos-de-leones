<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chetito Pro: Fireball Edition</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a2e; color: #fff; font-family: 'Courier New', monospace; }
        h1 { margin: 4px 0 10px; color: #ff8500; text-align: center; text-shadow: 2px 2px #000; font-size: clamp(20px, 5vw, 28px); }
        #hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin-bottom: 8px; padding: 8px 14px; border-radius: 6px; background: #0c0c1dbb; font-weight: bold; text-align: center; }
        #hud span { color: #ffd166; }
        canvas { display: block; width: min(850px, 95vw); height: auto; border: 4px solid #161625; background: linear-gradient(#111e36, #22355c); box-shadow: 0 10px 30px #000b; image-rendering: pixelated; }
        .instructions { max-width: 850px; margin-top: 9px; color: #c2c2e0; font-size: 13px; line-height: 1.6; text-align: center; }
        button { margin: 8px 4px 0; padding: 8px 14px; border: 1px solid #ff8500; border-radius: 5px; background: #282848; color: #fff; font: bold 14px 'Courier New', monospace; cursor: pointer; }
        button:hover { background: #41416b; }
    </style>
</head>
<body>
    <h1>🦁 Chetito Pro: Fireball Edition 🔥</h1>
    <div id="hud">
        <div>Nivel: <span id="level">1</span>/<span id="levelTotal">3</span></div>
        <div>Panecillos: <span id="mCount">0</span>/<span id="mTotal">10</span></div>
        <div>Enemigos: <span id="eCount">0</span></div>
        <div>Vidas: <span id="lCount">3</span></div>
        <div>Puerta: <span id="dStat">CERRADA</span></div>
    </div>
    <canvas id="gameCanvas" width="850" height="500" aria-label="Juego de plataformas Chetito Pro"></canvas>
    <div class="instructions">
        <strong>MOVERSE:</strong> Flechas o A/D &nbsp;|&nbsp; <strong>SALTAR:</strong> ↑, W o Espacio<br>
        🔥 <strong>ATACAR:</strong> X o J &nbsp;|&nbsp; <strong>PAUSAR:</strong> P o Esc &nbsp;|&nbsp; <strong>REINICIAR NIVEL:</strong> R
        <div><button id="pauseBtn" type="button">Pausar</button><button id="restartBtn" type="button">Reiniciar nivel</button></div>
    </div>
<script>
(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const ui = {
        level: document.getElementById('level'), levelTotal: document.getElementById('levelTotal'),
        muffins: document.getElementById('mCount'), muffinTotal: document.getElementById('mTotal'),
        enemies: document.getElementById('eCount'), lives: document.getElementById('lCount'),
        door: document.getElementById('dStat'), pause: document.getElementById('pauseBtn')
    };
    const W = canvas.width, H = canvas.height, GRAVITY = 0.62, MAX_LIVES = 3;
    const sprite = [
        ['.','N','N','N','N','.','.','.'], ['N','N','D','D','N','N','.','.'],
        ['N','D','B','X','D','N','N','.'], ['N','D','D','R','D','D','N','.'],
        ['.','N','D','D','D','D','N','.'], ['.','N','N','N','N','N','N','.'],
        ['.','.','D','D','.','D','D','.'], ['.','.','N','.','.','N','.','.']
    ];
    const levels = [
        { name: 'Pradera de los panecillos', start: [45, 400], door: [790, 370], platforms: [[0,450,850,50],[120,350,140,20],[350,260,160,20],[90,190,130,20],[570,210,150,20],[700,330,100,20]], muffins: [[190,310],[120,150],[180,150],[380,220],[450,220],[600,170],[670,170],[750,290],[50,410],[520,410]], enemies: [[360,235,350,485,1.5],[130,325,120,235,2],[580,185,570,695,1.8]] },
        { name: 'Cavernas ardientes', start: [35, 400], door: [790, 370], platforms: [[0,450,850,50],[90,365,130,18],[280,300,150,18],[500,350,130,18],[660,280,130,18],[100,205,130,18],[350,175,145,18],[590,140,150,18]], muffins: [[120,325],[185,325],[315,260],[390,260],[535,310],[590,310],[700,240],[750,240],[390,135],[650,100]], enemies: [[300,275,280,410,1.8],[680,255,660,770,2],[365,150,350,470,1.6]] },
        { name: 'Cielo de leones', start: [35, 400], door: [790, 370], platforms: [[0,450,850,50],[100,365,120,18],[270,300,120,18],[440,235,120,18],[610,300,120,18],[730,365,90,18],[90,190,120,18],[300,140,120,18],[520,175,120,18],[700,115,100,18]], muffins: [[120,325],[180,325],[300,260],[355,260],[470,195],[525,135],[650,260],[750,325],[340,100],[740,75]], enemies: [[110,340,100,205,1.8],[285,275,270,375,2],[625,275,610,715,2],[710,90,700,780,1.5]] }
    ];
    ui.levelTotal.textContent = levels.length;
    const player = { x: 0, y: 0, w: 40, h: 40, vx: 0, vy: 0, speed: 5.2, jump: 12.5, grounded: false, facing: 1, invulnerable: 0 };
    let levelIndex = 0, platforms = [], muffins = [], enemies = [], fireballs = [], door = null;
    let score = 0, lives = MAX_LIVES, mode = 'playing', shootCooldown = 0;
    const keys = Object.create(null);
    const overlaps = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

    function loadLevel(index) {
        const data = levels[index]; levelIndex = index;
        platforms = data.platforms.map(([x,y,w,h]) => ({x,y,w,h}));
        muffins = data.muffins.map(([x,y]) => ({x,y,r:10,collected:false}));
        enemies = data.enemies.map(([x,y,minX,maxX,speed]) => ({x,y,w:25,h:25,minX,maxX,speed,initialSpeed:speed}));
        fireballs = []; door = {x:data.door[0],y:data.door[1],w:45,h:80};
        player.x = data.start[0]; player.y = data.start[1]; player.vx = 0; player.vy = 0; player.grounded = false; player.invulnerable = 0;
        score = 0; mode = 'playing'; updateHud();
    }
    function updateHud() {
        ui.level.textContent = levelIndex + 1; ui.muffins.textContent = score;
        ui.muffinTotal.textContent = muffins.length; ui.enemies.textContent = enemies.length;
        ui.lives.textContent = lives;
        const open = score === muffins.length;
        ui.door.textContent = open ? '¡ABIERTA!' : 'CERRADA'; ui.door.style.color = open ? '#2ecc71' : '#ff6b81';
        ui.pause.textContent = mode === 'paused' ? 'Continuar' : 'Pausar';
    }
    function resetLevel() { loadLevel(levelIndex); }
    function takeHit() {
        if (player.invulnerable > 0) return;
        lives--; updateHud();
        if (lives <= 0) { mode = 'gameover'; return; }
        const start = levels[levelIndex].start;
        player.x = start[0]; player.y = start[1]; player.vx = 0; player.vy = 0; player.invulnerable = 100;
    }
    function shoot() {
        if (mode !== 'playing' || shootCooldown > 0) return;
        fireballs.push({x: player.facing > 0 ? player.x+player.w : player.x-14, y:player.y+17, w:14,h:9,vx:player.facing*9});
        shootCooldown = 18;
    }
    window.addEventListener('keydown', e => {
        const key = e.key.toLowerCase();
        if (['arrowleft','arrowright','arrowup',' ','arrowdown'].includes(key)) e.preventDefault();
        keys[key] = true;
        if (e.repeat) return;
        if (key === 'p' || key === 'escape') { if (mode === 'playing') mode = 'paused'; else if (mode === 'paused') mode = 'playing'; updateHud(); }
        if (key === 'r') resetLevel();
        if (key === 'x' || key === 'j') shoot();
        if ((key === 'enter' || key === ' ') && mode === 'gameover') { lives = MAX_LIVES; loadLevel(0); }
        if ((key === 'enter' || key === ' ') && mode === 'levelcomplete') { if (levelIndex < levels.length-1) loadLevel(levelIndex+1); else { lives=MAX_LIVES; loadLevel(0); } }
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { if (mode === 'playing') { mode='paused'; updateHud(); } });
    document.getElementById('pauseBtn').addEventListener('click', () => { if (mode==='playing') mode='paused'; else if (mode==='paused') mode='playing'; updateHud(); });
    document.getElementById('restartBtn').addEventListener('click', resetLevel);

    function update() {
        if (mode !== 'playing') return;
        if (shootCooldown > 0) shootCooldown--;
        if (player.invulnerable > 0) player.invulnerable--;
        const left = keys.arrowleft || keys.a, right = keys.arrowright || keys.d;
        if (left !== right) { player.vx = left ? -player.speed : player.speed; player.facing = left ? -1 : 1; }
        else player.vx *= 0.78;
        if ((keys.arrowup || keys.w || keys[' ']) && player.grounded) { player.vy = -player.jump; player.grounded = false; }
        // Resolve horizontal collisions first, including platform sides.
        player.x += player.vx;
        for (const p of platforms) if (overlaps(player,{x:p.x,y:p.y,w:p.w,h:p.h})) {
            if (player.vx > 0) player.x = p.x-player.w; else if (player.vx < 0) player.x = p.x+p.w;
            player.vx = 0;
        }
        player.x = Math.max(0, Math.min(W-player.w, player.x));
        // Then resolve vertical collisions from above and below.
        player.vy += GRAVITY; const oldY = player.y; player.y += player.vy; player.grounded = false;
        for (const p of platforms) if (overlaps(player,{x:p.x,y:p.y,w:p.w,h:p.h})) {
            if (player.vy > 0 && oldY+player.h <= p.y+2) { player.y=p.y-player.h; player.vy=0; player.grounded=true; }
            else if (player.vy < 0 && oldY >= p.y+p.h-2) { player.y=p.y+p.h; player.vy=0; }
        }
        if (player.y > H+80) takeHit();
        // Fireballs hit enemies and leave the playfield cleanly.
        for (let i=fireballs.length-1;i>=0;i--) {
            const f=fireballs[i]; f.x+=f.vx;
            if (f.x>W || f.x+f.w<0) { fireballs.splice(i,1); continue; }
            const hit=enemies.findIndex(en=>overlaps(f,{x:en.x,y:en.y,w:en.w,h:en.h}));
            if (hit>=0) { enemies.splice(hit,1); fireballs.splice(i,1); }
        }
        for (const en of enemies) {
            en.x += en.speed;
            if (en.x <= en.minX) { en.x=en.minX; en.speed=Math.abs(en.initialSpeed); }
            if (en.x+en.w >= en.maxX) { en.x=en.maxX-en.w; en.speed=-Math.abs(en.initialSpeed); }
            if (overlaps(player,{x:en.x,y:en.y,w:en.w,h:en.h})) takeHit();
        }
        for (const m of muffins) if (!m.collected && overlaps(player,{x:m.x-m.r,y:m.y-m.r,w:m.r*2,h:m.r*2})) { m.collected=true; score++; }
        if (score === muffins.length && overlaps(player,door)) mode='levelcomplete';
        updateHud();
    }
    function draw() {
        ctx.clearRect(0,0,W,H);
        // Small decorative stars
        ctx.fillStyle='#ffffff55'; for (const [x,y] of [[48,55],[220,80],[330,45],[520,70],[760,48],[815,125],[270,125]]) ctx.fillRect(x,y,3,3);
        for (const p of platforms) { ctx.fillStyle='#34345f'; ctx.fillRect(p.x,p.y,p.w,p.h); ctx.fillStyle='#ff8500'; ctx.fillRect(p.x,p.y,p.w,4); }
        for (const m of muffins) if (!m.collected) {
            ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fillStyle='#e67e22'; ctx.fill();
            ctx.beginPath(); ctx.arc(m.x,m.y-2,m.r*.7,Math.PI,0); ctx.fillStyle='#ff78ae'; ctx.fill();
        }
        for (const en of enemies) { ctx.fillStyle='#6246ea'; ctx.fillRect(en.x,en.y,en.w,en.h); ctx.fillStyle='#ff0055'; ctx.fillRect(en.speed>0?en.x+16:en.x+4,en.y+6,6,6); ctx.fillStyle='#1e1e30'; ctx.fillRect(en.x+4,en.y+en.h-4,6,4); ctx.fillRect(en.x+15,en.y+en.h-4,6,4); }
        for (const f of fireballs) { ctx.fillStyle='#ff3f34'; ctx.fillRect(f.x,f.y,f.w,f.h); ctx.fillStyle='#ffca28'; ctx.fillRect(f.x+4,f.y+2,f.w-6,5); }
        ctx.fillStyle=score===muffins.length?'#2ecc71':'#ff4757'; ctx.fillRect(door.x,door.y,door.w,door.h); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.strokeRect(door.x,door.y,door.w,door.h);
        ctx.fillStyle='#fff'; ctx.fillRect(door.x+9,door.y+12,5,5);
        if (player.invulnerable===0 || Math.floor(player.invulnerable/7)%2===0) {
            ctx.save(); if (player.facing<0) { ctx.translate(player.x+player.w,player.y); ctx.scale(-1,1); } else ctx.translate(player.x,player.y);
            for(let row=0;row<sprite.length;row++) for(let col=0;col<sprite[row].length;col++) {
                const pixel=sprite[row][col]; if(pixel==='.') continue;
                ctx.fillStyle=({N:'#ff6700',D:'#f1c40f',B:'#fff',X:'#000',R:'#e84393'})[pixel]; ctx.fillRect(col*5,row*5,5,5);
            }
            ctx.restore();
        }
        if (mode!=='playing') {
            ctx.fillStyle='rgba(8,8,25,.82)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
            let title='', detail='';
            if (mode==='paused') { title='PAUSA'; detail='Pulsa P o Esc para continuar'; }
            if (mode==='gameover') { title='FIN DE LA PARTIDA'; detail='Pulsa Enter o Espacio para volver a empezar'; }
            if (mode==='levelcomplete') {
                title=levelIndex===levels.length-1?'¡JUEGO COMPLETADO!':'¡NIVEL COMPLETADO!';
                detail=levelIndex===levels.length-1?'¡Chetito ha superado todos los niveles! Pulsa Enter para jugar otra vez':'Pulsa Enter para ir al siguiente nivel';
            }
            ctx.fillStyle='#ff8500'; ctx.font='bold 34px Courier New'; ctx.fillText(title,W/2,H/2-18);
            ctx.fillStyle='#fff'; ctx.font='16px Courier New'; ctx.fillText(detail,W/2,H/2+22);
        }
    }
    function frame() { update(); draw(); requestAnimationFrame(frame); }
    loadLevel(0); frame();
})();
</script>
</body>
</html>
