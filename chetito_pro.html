<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chetito Pro: Fireball Edition</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', Courier, monospace; color: white; overflow: hidden; }
        h1 { margin: 5px; color: #ff6700; text-shadow: 2px 2px #000; font-size: 26px; }
        #hud { font-size: 16px; margin-bottom: 8px; font-weight: bold; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 5px; }
        canvas { border: 4px solid #161625; background: linear-gradient(to bottom, #111e36, #22355c); box-shadow: 0px 10px 30px rgba(0,0,0,0.7); }
        .instructions { margin-top: 8px; color: #a2a2d0; font-size: 13px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>
    <h1>🦁 Chetito Pro: Fireball Edition 🔥</h1>
    <div id="hud">Panecillos: <span id="mCount">0</span>/10 | Enemigos: <span id="eCount">3</span> | Puerta: <span id="dStat" style="color: #ff4757;">CERRADA</span></div>
    <canvas id="gameCanvas" width="850" height="500"></canvas>
    <div class="instructions">
        <strong>CONTROLES:</strong> Flechas o A/D para moverte | Flecha Arriba, W o Espacio para Saltar<br>
        🔥 <strong>ATACAR:</strong> Presiona la tecla <strong>X</strong> o <strong>J</strong> para lanzar bolas de fuego.
    </div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        const mCountEl = document.getElementById("mCount");
        const eCountEl = document.getElementById("eCount");
        const dStatEl = document.getElementById("dStat");

        const chetitoSprite = [
            ['.', 'N', 'N', 'N', 'N', '.', '.', '.'],
            ['N', 'N', 'D', 'D', 'N', 'N', '.', '.'],
            ['N', 'D', 'B', 'X', 'D', 'N', 'N', '.'],
            ['N', 'D', 'D', 'R', 'D', 'D', 'N', '.'],
            ['.', 'N', 'D', 'D', 'D', 'D', 'N', '.'],
            ['.', 'N', 'N', 'N', 'N', 'N', 'N', '.'],
            ['.', '.', 'D', 'D', '.', 'D', 'D', '.'],
            ['.', '.', 'N', '.', '.', 'N', '.', '.']
        ];
        const pixelSize = 5; 
        const player = { x: 60, y: 300, width: 40, height: 40, vx: 0, vy: 0, speed: 5.5, jumpForce: 12.5, grounded: false, facing: "right" };
        const gravity = 0.6;
        const friction = 0.85;

        const platforms = [
            { x: 0, y: 450, width: 850, height: 50 },
            { x: 120, y: 350, width: 140, height: 20 },
            { x: 350, y: 260, width: 160, height: 20 },
            { x: 90, y: 190, width: 130, height: 20 },
            { x: 570, y: 210, width: 150, height: 20 },
            { x: 700, y: 330, width: 100, height: 20 }
        ];
        const muffins = [
            { x: 190, y: 310, r: 10, collected: false }, { x: 120, y: 150, r: 10, collected: false },
            { x: 180, y: 150, r: 10, collected: false }, { x: 380, y: 220, r: 10, collected: false },
            { x: 450, y: 220, r: 10, collected: false }, { x: 600, y: 170, r: 10, collected: false },
            { x: 670, y: 170, r: 10, collected: false }, { x: 750, y: 290, r: 10, collected: false },
            { x: 50, y: 410, r: 10, collected: false }, { x: 520, y: 410, r: 10, collected: false }
        ];
        let enemies = [
            { x: 360, y: 235, width: 25, height: 25, minX: 350, maxX: 485, speed: 1.5 },
            { x: 130, y: 325, width: 25, height: 25, minX: 120, maxX: 235, speed: 2 },
            { x: 580, y: 185, width: 25, height: 25, minX: 570, maxX: 695, speed: 1.8 }
        ];
        let fireballs = [];
        const door = { x: 780, y: 370, width: 45, height: 80, open: false };
        let score = 0; let gameWon = false; let canShoot = true; const keys = {};
              window.addEventListener("keydown", e => {
            keys[e.key] = true;
            if ((e.key === "x" || e.key === "X" || e.key === "j" || e.key === "J") && canShoot && !gameWon) { shootFireball(); canShoot = false; }
        });
        window.addEventListener("keyup", e => { keys[e.key] = false; if (e.key === "x" || e.key === "X" || e.key === "j" || e.key === "J") canShoot = true; });

        function shootFireball() {
            let fvx = player.facing === "right" ? 10 : -10;
            fireballs.push({ x: player.facing === "right" ? player.x + player.width : player.x, y: player.y + player.height / 2 - 4, width: 14, height: 8, vx: fvx });
        }

        function update() {
            if (gameWon) return;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) { player.vx = player.speed; player.facing = "right"; }
            else if (keys["ArrowLeft"] || keys["a"] || keys["A"]) { player.vx = -player.speed; player.facing = "left"; }
            else { player.vx *= friction; }

            if ((keys["ArrowUp"] || keys["w"] || keys["W"] || keys[" "]) && player.grounded) { player.vy = -player.jumpForce; player.grounded = false; }
            player.vy += gravity; player.x += player.vx; player.y += player.vy;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.grounded = false;
            for (let plat of platforms) {
                if (player.x < plat.x + plat.width && player.x + player.width > plat.x && player.y < plat.y + plat.height && player.y + player.height > plat.y) {
                    if (player.vy > 0 && (player.y + player.height - player.vy) <= plat.y) { player.y = plat.y - player.height; player.vy = 0; player.grounded = true; }
                }
            }

            for (let i = fireballs.length - 1; i >= 0; i--) {
                let f = fireballs[i]; f.x += f.vx;
                if (f.x < 0 || f.x > canvas.width) { fireballs.splice(i, 1); continue; }
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    if (f.x < en.x + en.width && f.x + f.width > en.x && f.y < en.y + en.height && f.y + f.height > en.y) { enemies.splice(j, 1); fireballs.splice(i, 1); eCountEl.innerText = enemies.length; break; }
                }
            }

            for (let en of enemies) {
                en.x += en.speed; if (en.x <= en.minX || en.x + en.width >= en.maxX) { en.speed *= -1; }
                if (player.x < en.x + en.width && player.x + player.width > en.x && player.y < en.y + en.height && player.y + player.height > en.y) { player.vx = en.speed > 0 ? 8 : -8; player.vy = -4; }
            }

            for (let m of muffins) {
                if (!m.collected) {
                    if (player.x < m.x + m.r && player.x + player.width > m.x - m.r && player.y < m.y + m.r && player.y + player.height > m.y - m.r) {
                        m.collected = true; score++; mCountEl.innerText = score;
                        if (score === 10) { door.open = true; dStatEl.innerText = "¡ABIERTA!"; dStatEl.style.color = "#2ecc71"; }
                    }
                }
            }

            if (door.open && player.x < door.x + door.width && player.x + player.width > door.x && player.y < door.y + door.height && player.y + player.height > door.y) { gameWon = true; }
            draw(); requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let plat of platforms) { ctx.fillStyle = "#2c2c54"; ctx.fillRect(plat.x, plat.y, plat.width, plat.height); ctx.fillStyle = "#ff6700"; ctx.fillRect(plat.x, plat.y, plat.width, 4); }
            for (let m of muffins) {
                if (!m.collected) {
                    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fillStyle = "#e67e22"; ctx.fill(); ctx.closePath();
                    ctx.beginPath(); ctx.arc(m.x, m.y - 2, m.r * 0.7, Math.PI, 0); ctx.fillStyle = "#ff78ae"; ctx.fill(); ctx.closePath();
                }
            }
            for (let en of enemies) {
                ctx.fillStyle = "#482ff7"; ctx.fillRect(en.x, en.y, en.width, en.height); ctx.fillStyle = "#ff0055"; ctx.fillRect(en.speed > 0 ? en.x + 16 : en.x + 4, en.y + 6, 6, 6);
                ctx.fillStyle = "#1e1e30"; ctx.fillRect(en.x + 4, en.y + en.height - 4, 6, 4); ctx.fillRect(en.x + 15, en.y + en.height - 4, 6, 4);
            }
            for (let f of fireballs) { ctx.fillStyle = "#ff3f34"; ctx.fillRect(f.x, f.y, f.width, f.height); ctx.fillStyle = "#ffca28"; ctx.fillRect(f.vx > 0 ? f.x + 4 : f.x, f.y + 2, f.width - 4, f.height - 4); }
            ctx.fillStyle = door.open ? "#2ecc71" : "#ff4757"; ctx.fillRect(door.x, door.y, door.width, door.height); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.strokeRect(door.x, door.y, door.width, door.height);

            ctx.save();
            if (player.facing === "left") { ctx.translate(player.x + player.width, player.y); ctx.scale(-1, 1); } else { ctx.translate(player.x, player.y); }
            for (let row = 0; row < chetitoSprite.length; row++) {
                for (let col = 0; col < chetitoSprite[row].length; col++) {
                    const pixelType = chetitoSprite[row][col]; if (pixelType === '.') continue;
                    if (pixelType === 'N') ctx.fillStyle = "#ff6700";
                    else if (pixelType === 'D') ctx.fillStyle = "#f1c40f";
                    else if (pixelType === 'B') ctx.fillStyle = "#ffffff";
                    else if (pixelType === 'X') ctx.fillStyle = "#000000";
                    else if (pixelType === 'R') ctx.fillStyle = "#e84393";
                    ctx.fillRect(col * pixelSize, row * pixelSize, pixelSize, pixelSize);
                }
            }
            ctx.restore();

            if (gameWon) {
                ctx.fillStyle = "rgba(10, 10, 30, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#ff6700"; ctx.font = "32px 'Courier New'"; ctx.textAlign = "center";
                ctx.fillText("¡NIVEL COMPLETADO PRO!", canvas.width / 2, canvas.height / 2 - 20); ctx.fillStyle = "#fff"; ctx.font = "18px 'Courier New'"; ctx.fillText("Chetito usó sus fuegos, derrotó amenazas y salvó los panecillos.", canvas.width / 2, canvas.height / 2 + 20);
            }
        }
        update();
    </script>
</body>
</html>
